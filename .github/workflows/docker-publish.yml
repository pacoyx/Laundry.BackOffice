name: Build, test and push Docker image

on:
  push:
    branches:
      - main

jobs:
  # Job 1: construye la imagen y la prueba contra una BD SQL Server desechable.
  # Si algo falla aqui, el job "build-and-push" nunca se ejecuta.
  smoke-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Password_123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "echo quit | /opt/mssql-tools18/bin/sqlcmd -No -C -S localhost -U sa -P 'Test_Password_123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restaurar dependencias
        run: dotnet restore 24dex-backend-comercial.csproj

      # Crea el esquema (tablas) en la BD desechable. Sin esto, los seeders
      # truenan al iniciar porque las tablas no existen.
      - name: Aplicar migraciones a la BD de prueba
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project 24dex-backend-comercial.csproj \
            --connection "Server=localhost,1433;Database=SmokeTestDb;User Id=sa;Password=Test_Password_123!;TrustServerCertificate=True;"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (solo local, no se sube)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: smoke-test-image:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Valores de prueba, no son secretos reales ni se usan en produccion.
      - name: Levantar contenedor de prueba
        run: |
          docker run -d --name smoke-test \
            --network host \
            -e ConnectionStrings__DefaultConnection="Server=localhost,1433;Database=SmokeTestDb;User Id=sa;Password=Test_Password_123!;TrustServerCertificate=True;" \
            -e Encryption__Key="MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=" \
            -e Jwt__Key="smoke-test-only-key-not-for-real-use-32chars" \
            -e Jwt__Issuer="smoke-test" \
            -e Jwt__Audience="smoke-test" \
            smoke-test-image:ci

      - name: Esperar a que /health responda
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:80/health; then
              echo "Backend respondio OK"
              exit 0
            fi
            echo "Esperando a que el backend levante... intento $i"
            sleep 3
          done
          echo "El backend no respondio a tiempo"
          exit 1

      - name: Logs del contenedor (util si fallo el paso anterior)
        if: always()
        run: docker logs smoke-test || true

      - name: Detener contenedor de prueba
        if: always()
        run: docker rm -f smoke-test || true

  # Job 2: solo corre si "smoke-test" paso correctamente.
  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: pacoyx2484/24dex-backend-comercial:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
